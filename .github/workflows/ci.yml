name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: conservative
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12' # minimum Julia version supported (must match Project.toml's compat bound)
          - '1' # latest stable 1.x release of Julia
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # Project.toml's own [sources] override already pins SupplyChainModeling
      # to whichever branch/rev currently has the unreleased features this
      # package depends on - a separate `Pkg.add(rev=...)` step here used to
      # duplicate that, and when the two disagreed (this step pinned "main",
      # Project.toml pinned a feature branch) Pkg had to reconcile conflicting
      # pins on every job, which is expensive across the whole matrix.
      #
      # Manifest.toml is a checked-in snapshot, not something CI regenerates
      # and commits back - so a direct-dependency change in Project.toml
      # (e.g. adding a package) leaves it stale until someone resolves and
      # commits a fresh one. julia-buildpkg's Pkg.build() calls instantiate()
      # internally, which *hard errors* on a manifest missing a direct
      # dependency (unlike a merely version-mismatched manifest, which it
      # would resolve on its own) - so resolve explicitly first.
      - run: julia --project=@. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.resolve()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: |
          julia --project=docs -e '
            using Documenter: doctest
            using SupplyChainSimulation
            doctest(SupplyChainSimulation)'
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
