name: CI
on:
  workflow_dispatch:
    branches:
      - master
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: conservative
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12' # Replace this with the minimum Julia version that your package supports. E.g. if your package requires Julia 1.5 or higher, change this to '1.5'.
          - '1' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # TEMPORARY: SupplyChainModeling's capacity/overflow-cost and
      # hash-caching features (PRs #2 and #5) are merged to main, but no new
      # version has been registered in the Julia registry to reflect them -
      # merging to main and registering a release are separate steps, and
      # only the latter makes `Pkg.add`/compat-bound resolution see the
      # change. Tracking main directly here bypasses that gap. The previous
      # pin (claude/integer-indexing-simulation-pvnr4d) pointed at a PR that
      # was closed without merging, which is what broke this step - main
      # already includes everything that branch would have added, achieved
      # instead via cheaper name-hash caching (see SupplyChainModeling PR
      # #5) rather than id-based identity. Remove this step and bump the
      # SupplyChainModeling compat bound once a new version is registered.
      - run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/SupplyChef/SupplyChainModeling.jl", rev="main")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v3
        with:
          file: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: |
          julia --project=docs -e '
            using Documenter: doctest
            using SupplyChainSimulation   
            doctest(SupplyChainSimulation)' 
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v3
