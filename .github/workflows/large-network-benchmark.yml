name: Large network benchmark

on:
  workflow_dispatch:
    inputs:
      storage_count:
        description: 'Number of storages (~nodes) in the synthetic network'
        default: '10000'
      product_count:
        description: 'Number of products'
        default: '5'
      horizon:
        description: 'Simulation horizon (periods)'
        default: '52'
      env_only:
        description: 'Skip the full simulate() benchmark, only measure Env construction'
        type: boolean
        default: true

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: conservative

jobs:
  benchmark:
    name: benchmarks.jl @ ${{ inputs.storage_count }} storages
    runs-on: ubuntu-latest
    # Safety net, same reasoning as Profile's jobs: an unexpectedly large
    # storage_count (or a regression that turns Env construction/simulate()
    # superlinear in it) should fail clearly instead of running for hours.
    # BenchmarkTools' own samples=/seconds= budgets in benchmarks.jl bound
    # each individual @benchmark call; this bounds the job as a whole.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
          arch: x64
      - run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=benchmark benchmark/benchmarks.jl ${{ inputs.env_only && '--env-only' || '' }}
        env:
          BENCHMARK_STORAGE_COUNT: ${{ inputs.storage_count }}
          BENCHMARK_PRODUCT_COUNT: ${{ inputs.product_count }}
          BENCHMARK_HORIZON: ${{ inputs.horizon }}
