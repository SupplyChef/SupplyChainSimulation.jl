# TEMPORARY: merging to SupplyChainModeling's main branch and registering a
# new package version are separate steps, and only the latter is visible to
# normal compat-bound resolution - so main can (and currently does) contain
# merged features, like the capacity/overflow-cost support from PR #2 and
# the hash-caching work from PR #5, that the actually-registered version
# doesn't have yet. The previous pin here (claude/integer-indexing-simulation-pvnr4d)
# pointed at a PR that was closed without merging; main already includes
# everything that branch would have added, achieved instead via cheaper
# name-hash caching rather than id-based identity. Remove this section and
# bump the SupplyChainModeling compat bound once a new version is registered.
[sources]
SupplyChainModeling = {url = "https://github.com/SupplyChef/SupplyChainModeling.jl", rev = "main"}
