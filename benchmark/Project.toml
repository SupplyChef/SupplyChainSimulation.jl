[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SupplyChainModeling = "8a0b78ce-42db-494b-a45c-80b287de1a3d"
SupplyChainSimulation = "1febdd50-69ad-4f0a-8312-f316c31db602"

# Mirrors the root Project.toml's SupplyChainModeling override: this is a
# standalone Pkg environment, so it does not inherit the root's [sources]
# override and would otherwise silently resolve SupplyChainModeling from the
# registry (predating the current optimization work), or main (missing
# ConcreteNode - see root Project.toml's comment).
[sources]
SupplyChainSimulation = {path = ".."}
SupplyChainModeling = {url = "https://github.com/SupplyChef/SupplyChainModeling.jl", rev = "claude/benchmark-performance-stalled-hbsfre"}
